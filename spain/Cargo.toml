[package]
name = "spain"
version = "0.1.0"
edition = "2024"

[dependencies]
ff = { path = "../ff" }
iop = { path = "../iop" }
protocol = { path = "../protocol" }
dark = { path = "../dark" }
ndarray-rand = "0.16.0"
parse = { path = "../parse" }
stream = { path = "../stream" }
model = { path = "../model" }
rand = "0.9.1"
rug = "1.27.0"
i256 = { version = "0.2.2", features = ["i512", "i1024"] }
serde_json = "1.0.140"
serde = "1.0.219"
env_logger = "0.11.8"
clap = { version = "4.5.53", features = ["derive"] }
anyhow = "1.0.99"
ndarray = "0.17.2"

[[bin]]
name = "main"
path = "src/main.rs"

[dev-dependencies]
criterion = "0.5"

[profile.release]
overflow-checks = true

[package]
name = "dark"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.53", features = ["derive"] }
rand = "0.9.1"
rand_old = { version = "=0.8.5", package = "rand" }
rug = {version = "1.21.0", features = ["serde"] }
once_cell = "1.18.0"
sha2 = "0.10.9"
stream = { path = "../stream" }
ff = { path = "../ff"}
criterion = "0.6.0"
rayon = "1.11.0"
ark-ff = "0.5.0"
ark-serialize = {version = "0.5.0", features = ["derive"] }
ark-std = "0.5.0"
rsa = "0.9.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
protocol = { path = "../protocol" }
i256 = { version = "0.2.2", features = ["i512"] }

[[bin]]
name = "actor"
path = "src/bin/actor_bin.rs"

[[bench]]
name = "bench"
harness = false


[features]
asm = []
